[project]
name = "rentsafe-backend"
version = "0.1.0"
description = "RentSafe Lagos — rental transparency & intelligence API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",          # zero-setup local dev database
    "asyncpg>=0.30",            # production Postgres driver
    "geoalchemy2>=0.16",        # production PostGIS types
    "alembic>=1.14",
    "redis>=5.2",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    # `services.media` imports PIL at module scope and the photo endpoints are
    # part of the core app, so this is a base dependency, not an extra. It was
    # previously listed only under a `workers` extra that nothing installed —
    # a fresh `pip install .` produced an app that crashed on import.
    "pillow>=11.0",
]

[project.optional-dependencies]
# Object storage for uploaded photos. Any S3-compatible provider (AWS,
# Cloudflare R2, DigitalOcean Spaces, MinIO) — see services.media.S3MediaStore.
storage = [
    "boto3>=1.35",
]
# Web Push for area watches. Optional — without it push degrades to a no-op
# rather than a boot failure, because nobody is locked out of the app without it.
push = [
    "pywebpush>=2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic/versions"]   # generated migrations

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
ignore = [
    # `Depends(...)` / `Query(...)` in argument defaults is the FastAPI idiom,
    # not the mutable-default bug this rule is aimed at.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# env.py must configure the path before importing app modules.
"alembic/env.py" = ["E402"]
# Reusing a pytest fixture across modules means importing it and then naming it
# as a test argument. Ruff reads that as a redefinition; pytest requires it.
"tests/*" = ["F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
